<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 380" width="1160" height="380" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Data pipeline: public sources, extraction, cleaning, analysis and forecasting, dashboard</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B7487"/>
    </marker>
  </defs>
  <rect width="1160" height="380" rx="18" fill="#F3F7F9"/>

  <g font-size="12" font-weight="600" fill="#5B7487" letter-spacing="1.2">
    <text x="40" y="38">PUBLIC SOURCES</text>
    <text x="265" y="38">PIPELINE</text>
    <text x="690" y="38">ANALYSIS</text>
    <text x="925" y="38">OUTPUT</text>
  </g>

  <g font-size="14" fill="#10293A">
    <rect x="40" y="56" width="190" height="62" rx="12" fill="#FFFFFF" stroke="#C9D8E0"/>
    <text x="56" y="82" font-weight="600">REN Data Hub</text>
    <text x="56" y="102" font-size="12" fill="#5B7487">Production and prices</text>

    <rect x="40" y="134" width="190" height="62" rx="12" fill="#FFFFFF" stroke="#C9D8E0"/>
    <text x="56" y="160" font-weight="600">E-REDES Open Data</text>
    <text x="56" y="180" font-size="12" fill="#5B7487">EV charging by municipality</text>

    <rect x="40" y="212" width="190" height="62" rx="12" fill="#FFFFFF" stroke="#C9D8E0"/>
    <text x="56" y="238" font-weight="600">INE</text>
    <text x="56" y="258" font-size="12" fill="#5B7487">Resident population</text>

    <rect x="40" y="290" width="190" height="62" rx="12" fill="#FFFFFF" stroke="#C9D8E0"/>
    <text x="56" y="316" font-weight="600">DGT (CAOP)</text>
    <text x="56" y="336" font-size="12" fill="#5B7487">Municipality boundaries</text>
  </g>

  <g font-size="14" fill="#FFFFFF">
    <rect x="265" y="92" width="185" height="120" rx="14" fill="#2C7FB8"/>
    <text x="283" y="120" font-weight="600">01 Extraction</text>
    <text x="283" y="142" font-size="12">Incremental downloads,</text>
    <text x="283" y="158" font-size="12">rolling five-year window</text>
    <text x="283" y="188" font-size="12" font-family="Consolas, 'Courier New', monospace">data/raw/</text>

    <rect x="480" y="92" width="185" height="120" rx="14" fill="#1F5A8A"/>
    <text x="498" y="120" font-weight="600">02 Cleaning</text>
    <text x="498" y="142" font-size="12">Tidy tables, quality checks,</text>
    <text x="498" y="158" font-size="12">two renewable shares</text>
    <text x="498" y="188" font-size="12" font-family="Consolas, 'Courier New', monospace">data/processed/</text>
  </g>

  <g font-size="14" fill="#10293A">
    <rect x="690" y="56" width="200" height="84" rx="14" fill="#FFFFFF" stroke="#C9D8E0"/>
    <text x="706" y="84" font-weight="600">03 Exploratory analysis</text>
    <text x="706" y="106" font-size="12" fill="#5B7487">Trends, seasonality, prices,</text>
    <text x="706" y="122" font-size="12" fill="#5B7487">the 2025 blackout</text>

    <rect x="690" y="156" width="200" height="84" rx="14" fill="#FFFFFF" stroke="#C9D8E0"/>
    <text x="706" y="184" font-weight="600">04 Forecasting</text>
    <text x="706" y="206" font-size="12" fill="#5B7487">Walk-forward test of five</text>
    <text x="706" y="222" font-size="12" fill="#5B7487">models, next-day forecast</text>
  </g>

  <g fill="#FFFFFF">
    <rect x="925" y="92" width="200" height="200" rx="14" fill="#10293A"/>
    <text x="943" y="122" font-size="14" font-weight="600">Streamlit dashboard</text>
    <g font-size="12">
      <text x="943" y="148">Five chapters and a bonus</text>
      <text x="943" y="168">Filters on every page</text>
      <text x="943" y="188">Text written from the data</text>
      <text x="943" y="208">English and Portuguese</text>
    </g>
    <text x="943" y="258" font-size="11" fill="#9CC8E8" font-family="Consolas, 'Courier New', monospace">streamlit run app/app.py</text>
  </g>

  <g stroke="#5B7487" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M230,87 C250,87 250,128 263,128"/>
    <path d="M230,165 C248,165 250,150 263,150"/>
    <path d="M230,243 C252,243 250,174 263,174"/>
    <path d="M450,152 L478,152"/>
    <path d="M665,130 C678,130 676,98 688,98"/>
    <path d="M665,174 C678,174 676,198 688,198"/>
    <path d="M890,198 L923,198"/>
    <path d="M572,212 L572,266 L923,266" stroke-dasharray="5 4"/>
    <path d="M230,321 L1025,321 L1025,294" stroke-dasharray="5 4"/>
  </g>
  <g font-size="11" fill="#5B7487">
    <text x="590" y="284">tables and forecasts read by the app</text>
    <text x="250" y="342">municipality boundaries, built once with scripts/build_municipalities_geojson.py</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
