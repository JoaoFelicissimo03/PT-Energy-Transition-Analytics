# Refreshes the data every morning: downloads the missing days, rebuilds the tables and the
# forecasts, checks them, runs the tests and commits the new tables. Streamlit Community Cloud
# picks up the commit, so the dashboard shows the new data without anyone running the notebooks.
name: Update data

on:
  schedule:
    - cron: "41 6 * * *"   # every day at 06:41 UTC
  workflow_dispatch:         # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150   # a run without the cache downloads five years again (about an hour)

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the pipeline
        run: pip install -r requirements.txt

      # The REN downloads (about 23 MB) are not in the repository. The cache keeps them between
      # runs, so a normal run only asks REN for the days it does not have yet.
      - name: Restore the REN downloads
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/ren_production_breakdown_raw.json
            data/raw/ren_market_prices_raw.json
          key: ren-raw-${{ github.run_id }}
          restore-keys: ren-raw-

      - name: 01 Extraction
        run: |
          jupyter nbconvert --to notebook --execute notebooks/01_extraction.ipynb \
            --output-dir "$RUNNER_TEMP/executed" --ExecutePreprocessor.timeout=-1

      - name: Save the REN downloads
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw/ren_production_breakdown_raw.json
            data/raw/ren_market_prices_raw.json
          key: ren-raw-${{ github.run_id }}

      - name: 02 Cleaning
        run: |
          jupyter nbconvert --to notebook --execute notebooks/02_cleaning.ipynb \
            --output-dir "$RUNNER_TEMP/executed" --ExecutePreprocessor.timeout=-1

      - name: 04 Forecasting
        run: |
          jupyter nbconvert --to notebook --execute notebooks/04_predictive_model.ipynb \
            --output-dir "$RUNNER_TEMP/executed" --ExecutePreprocessor.timeout=-1

      - name: Check the new tables
        run: python scripts/check_processed.py

      - name: Run the tests
        run: pytest -q

      # The executed notebooks show every printed check of the run; useful when something fails
      - name: Keep the executed notebooks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebooks
          path: ${{ runner.temp }}/executed
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit the new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/processed data/raw   # .gitignore keeps the large REN downloads out
          if git diff --cached --quiet; then
            echo "No new data today."
            exit 0
          fi
          git commit -m "Update data to $(date -u -d yesterday +%Y-%m-%d)"
          git push
